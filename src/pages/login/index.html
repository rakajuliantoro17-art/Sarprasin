<!DOCTYPE html>

<html lang="id">


<head>


<meta charset="UTF-8">


<meta 
name="viewport"
content="width=device-width, initial-scale=1.0"
>


<title>
Login | SARPRASIN v2.0
</title>



<link 
rel="icon"
href="../../assets/img/favicon.ico"
>



<link
rel="stylesheet"
href="../../assets/css/app.css"
>


<link
rel="stylesheet"
href="./style.css"
>


</head>



<body class="login-body">



<div class="login-container">



    <div class="login-card">



        <!-- LOGO -->

        <div class="login-brand">


            <img
            src="../../assets/img/logo.png"
            alt="SMANSASOO"
            >


            <h1>
            SARPRASIN
            </h1>


            <p>
            Smart School Asset Management System
            </p>


        </div>





        <!-- LOGIN FORM -->


        <form
        id="loginForm"
        >



            <div class="form-group">


                <label>
                Email
                </label>


                <input
                type="email"
                id="email"
                placeholder="email pengguna"
                required
                >


            </div>





            <div class="form-group">


                <label>
                Password
                </label>


                <input
                type="password"
                id="password"
                placeholder="password"
                required
                >


            </div>






            <div class="login-option">


                <label>


                    <input
                    type="checkbox"
                    id="remember"
                    >


                    Ingat saya


                </label>


            </div>







            <button
            type="submit"
            class="login-button"
            >


                Masuk


            </button>





            <div
            id="loginMessage"
            class="login-message"
            >


            </div>



        </form>






        <!-- FOOTER -->


        <div class="login-footer">


            <p>
            © 2026 SMAN 1 Sooko Mojokerto
            </p>


        </div>




    </div>




</div>




<script
type="module"
src="./script.js"
></script>



</body>


</html>
