<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pengguna | SARPRASIN</title>
    <link rel="icon" href="/logo/icon.png">
    <link rel="stylesheet" href="/src/assets/css/app.css">
</head>
<body>

    <div class="shell-loading" id="shellLoading">Memeriksa sesi login...</div>

    <div id="pageContent" hidden>
        <div class="dashboard-title no-print">
            <h2>Inventaris Ruangan</h2>
            <span>Pilih ruangan untuk melihat dan mencetak kartunya</span>
        </div>

        <div class="dashboard-panel glass no-print">
            <div class="page-toolbar">
                <select id="roomSelect"><option value="">- pilih ruangan -</option></select>
                <button type="button" class="btn-primary" id="printBtn">🖨️ Cetak / Simpan PDF</button>
            </div>
            <p class="hint">Data hanya dapat dilihat. Perubahan data dilakukan oleh petugas sarpras.</p>
        </div>

        <div id="kirSheet" class="kir-sheet">
            <p class="page-empty">Pilih ruangan untuk menampilkan kartu inventaris.</p>
        </div>
    </div>

    <script type="module" src="/src/assets/js/pages/user.js"></script>
</body>
</html>
